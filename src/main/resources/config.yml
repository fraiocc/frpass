config-version: 2 # Do not edit. Used to add new default settings after updates.

database:
  type: SQLITE # Options: SQLITE, MYSQL, MARIADB, POSTGRESQL
  file: "database.db"
  host: "localhost"
  port: 3306 # Default ports: MySQL/MariaDB: 3306, PostgreSQL: 5432
  database: "frpass"
  username: "root"
  password: ""
  useSSL: false
  maximumPoolSize: 10
  minimumIdle: 2
  connectionTimeout: 30000

settings:
  lang: "en" # Options: en, tr, de, fr
  prefix: "&aFrPass &8» &7"
  generate-default-files: true
  notify-unclaimed-on-join: true
  quest-actionbar: true
  sounds:
    level-up: "ENTITY_PLAYER_LEVELUP"
    quest-complete: "ENTITY_EXPERIENCE_ORB_PICKUP"
    claim-reward: "ENTITY_VILLAGER_YES"
  command-aliases:
    - "bp"
  frsync:
    notify-console: true

tier-icons:
  claimed:
    material: "MINECART"
    custom-model-data: 0
  unlocked:
    material: "CHEST_MINECART"
    custom-model-data: 0
  locked:
    material: "HOPPER_MINECART"
    custom-model-data: 0

quest-system:
  mode: ROTATING # Options: ALL, ROTATING
  rotate-interval: DAILY # Options: DAILY, WEEKLY
  rotate-amount: 5
  ignore-creative: true # Creative/Spectator players do not gain quest progress
  premium-xp-multiplier: 1.0 # Quest XP multiplier for Premium players (e.g. 1.5 = +50% XP)
  completion-bonus:
    enabled: true # Bonus granted once per cycle when all active quests are completed
    xp: 250
    rewards: []

premium-ticket:
  material: "PAPER"
  custom-model-data: 1000
  name: "&e&lPremium Pass Ticket"
  lore:
    - "&7"
    - "&7Right-click this item to"
    - "&7unlock the &ePremium Battlepass&7!"
    - "&7"
    - "&aClick to use!"
  glow: true

gift:
  enabled: true
  permission: "frpass.gift"
  cost:
    money: 0.0 # Vault money required to gift
    xp: 0      # Player Pass XP required to gift
    level: 0   # Minimum Pass level required to gift
  transfer-premium: true # Removes sender's premium status and transfers it to recipient

reroll:
  enabled: true
  require-permission: false
  permission: "frpass.reroll"
  limit: 3 # Maximum number of quests a player can reroll in one selection session
  slot: -1 # Slot in quests GUI (-1 for auto position: bottom row middle -> right -> left -> fallback)
  button:
    material: "SUNFLOWER"
    custom-model-data: 0
    name: "&e&lQuest Reroll"
    lore-normal:
      - "&7Click to enter Reroll Mode."
      - "&7Select up to &e%limit% &7quests to replace."
      - "&7Currently selected: &e%selected%/%limit%"
    lore-mode-active:
      - "&a&lREROLL MODE"
      - "&7Select the quests you want to reroll."
      - "&7Selected: &e%selected%/%limit%"
      - "&eClick this button again to CONFIRM reroll."
      - "&cPress ESC to CANCEL."

ai:
  enabled: true

leaderboard:
  menu-enabled: true # false: /frpass top prints the list in chat instead of opening the menu
  size: 10 # Number of ranked players (max 100)
  refresh-seconds: 60 # How often the ranking is refreshed from the database

placeholders:
  premium-true: "&aYes"
  premium-false: "&cNo"
  top-empty: "-" # Shown by %frpass_top_<n>_name/tier/xp% when the rank is empty
