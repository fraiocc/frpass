name: FrPass
version: '${version}'
main: cc.fraio.frpass.FrPass
api-version: '1.21'
folia-supported: true
prefix: FrPass
authors: [ Fraio ]
website: "https://fraio.cc"
description: Advanced, completely customizable packet-based Battlepass.
depend: [packetevents]
softdepend: [Vault, PlaceholderAPI, MusoPlugin, Nexo]

commands:
  frpass:
    description: Main player command
    aliases: [ pass, battlepass ]
  frpassadmin:
    description: Main admin command
    permission: frpass.admin

libraries:
  - "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
  - "com.zaxxer:HikariCP:5.1.0"
  - "org.mariadb.jdbc:mariadb-java-client:3.3.3"
  - "org.postgresql:postgresql:42.7.3"
